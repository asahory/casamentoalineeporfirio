<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nossa Renovação de Votos</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { --cor: #8a6d5a; --fundo: #fbf8f4; --texto: #3b3330; --scroll-duration: 30s; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Montserrat, sans-serif; color: var(--texto); background: var(--fundo); line-height: 1.7; }
  h1, h2, h3 { font-family: 'Cormorant Garamond', serif; font-weight: 600; margin: 0 0 16px; }
  h2 { font-size: 2.4rem; color: var(--cor); text-align: center; }
  section { padding: 72px 20px; max-width: 960px; margin: auto; }
  .hero {
    min-height: 100vh; max-width: none; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center; color: #fff;
    background: linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.45)), url('FOTO_CAPA.jpg') center/cover;
  }
  .hero h1 { font-size: 4rem; margin: 0; }
  .hero p { font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; }
  .contagem { display: flex; gap: 18px; margin-top: 28px; }
  .contagem div { background: rgba(255,255,255,.15); padding: 12px 16px; border-radius: 10px; min-width: 70px; }
  .contagem span { display: block; font-size: 1.8rem; font-family: 'Cormorant Garamond', serif; }
  .card { background: #fff; border-radius: 14px; padding: 28px; box-shadow: 0 4px 18px rgba(0,0,0,.06); }
  .grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  button, .botao {
    background: var(--cor); color: #fff; border: 0; padding: 10px 18px; border-radius: 8px;
    cursor: pointer; font-family: inherit; text-decoration: none; display: inline-block; font-size: .95rem;
  }
  button.secundario { background: transparent; color: var(--cor); border: 1px solid var(--cor); }
  input, textarea, select { width: 100%; padding: 10px; border: 1px solid #d8cfc7; border-radius: 8px; font-family: inherit; margin-bottom: 12px; }
  .mensagem { border-left: 3px solid var(--cor); padding: 12px 16px; margin-bottom: 14px; background: #fff; border-radius: 8px; }
  .mensagem strong { color: var(--cor); }
  .cota-valor { font-size: 1.6rem; font-family: 'Cormorant Garamond', serif; color: var(--cor); }
  .cota.paga { opacity: .5; }
  details { background: #fff; border-radius: 10px; padding: 16px 20px; margin-bottom: 12px; }
  summary { cursor: pointer; font-weight: 600; }
  .aviso { font-size: .9rem; color: #6b5b50; }
  .oculto { display: none; }
  .msg-status { margin-top: 10px; font-weight: 600; color: var(--cor); }

  /* Galeria: loop infinito apenas automático (mais suave via transform) */
  .galeria-wrapper { position: relative; }
  .galeria {
    margin: 0 -6px; /* alinha com o padding interno */
  }
  .galeria-track {
    display: flex;
    gap: 16px;
    align-items: center;
    will-change: transform;
    transform: translateX(0);
  }
  .galeria-item {
    flex: 0 0 auto;
    width: 320px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    background: #fff;
  }
  .galeria-item img { width: 100%; height: 240px; object-fit: cover; display: block; }

  /* esconde interação do usuário */
  .galeria, .galeria * { pointer-events: none; }
  .galeria::-webkit-scrollbar { display: none; }

  @media (max-width: 600px) { .hero h1 { font-size: 2.6rem; } .galeria-item { width: 260px; } }
</style>
</head>
<body>

<script>
const CONFIG = {
  noivos: 'Aline & Porfírio',
  dataCasamento: '2026-11-25T18:00:00-03:00',
  dataExibicao: '25 de novembro de 2026',
  historia: 'Escreva aqui como vocês se conheceram. Pode ter quantos parágrafos quiser.',
  cerimonia: { horario: '18h00', local: 'Igreja São José', endereco: 'Rua, número, cidade' },
  festa: { horario: 'Após a cerimônia', local: 'Buscapé', endereco: 'Rua, número, cidade' },
  faq: [
    { p: 'Posso levar acompanhante?', r: 'Verifique o convite ou fale com a gente.' },
    { p: 'Qual o dress code?', r: 'Esporte fino.' }
  ],
  appScriptUrl: 'https://script.google.com/macros/s/AKfycbwCTIqLYdxu2BvYH6sSdfworjKMxDLPCvFd611sGbbBTyiSBErYPrAaGi9qi7j-X4F4fQ/exec',
  cotas: [
    { id: 'C01', titulo: 'Lua de mel - jantar', valor: 'R$ 100,00', pix: 'COLE_O_PIX_COPIA_E_COLA' },
    { id: 'C02', titulo: 'Jantar romântico', valor: 'R$ 150,00', pix: 'COLE_O_PIX_COPIA_E_COLA' },
    { id: 'C03', titulo: 'Passeio de barco', valor: 'R$ 200,00', pix: 'COLE_O_PIX_COPIA_E_COLA' }
  ]
};

const $ = id => document.getElementById(id);

// Contagem regressiva
function atualizarContagem() {
  const diff = new Date(CONFIG.dataCasamento) - new Date();
  if (diff <= 0) return;
  $('dias').textContent = Math.floor(diff / 86400000);
  $('horas').textContent = Math.floor(diff / 3600000) % 24;
  $('minutos').textContent = Math.floor(diff / 60000) % 60;
  $('segundos').textContent = Math.floor(diff / 1000) % 60;
}

function preencherTextos() {
  $('titulo').textContent = CONFIG.noivos;
  $('dataTexto').textContent = CONFIG.dataExibicao;
  $('historia').textContent = CONFIG.historia;
  $('cerimonia').innerHTML = `<b>${CONFIG.cerimonia.horario}</b><br>${CONFIG.cerimonia.local}<br><span class="aviso">${CONFIG.cerimonia.endereco}</span>`;
  $('festa').innerHTML = `<b>${CONFIG.festa.horario}</b><br>${CONFIG.festa.local}<br><span class="aviso">${CONFIG.festa.endereco}</span>`;
  $('faq').innerHTML = CONFIG.faq.map(f => `<details><summary>${f.p}</summary><p>${f.r}</p></details>`).join('');
  $('listaCotas').innerHTML = CONFIG.cotas.map(c => `
    <div class="card cota" id="card-${c.id}">
      <h3>${c.titulo}</h3>
      <p class="cota-valor">${c.valor}</p>
      <button onclick="copiarPix('${c.id}')">Copiar Pix</button>
      <button class="secundario" onclick="abrirPagamento('${c.id}')">Já paguei</button>
    </div>`).join('');
  $('selectCota').innerHTML = CONFIG.cotas.map(c => `<option value="${c.id}">${c.titulo} (${c.valor})</option>`).join('');
}

function copiarPix(id) {
  const cota = CONFIG.cotas.find(c => c.id === id);
  navigator.clipboard.writeText(cota.pix).then(() => alert('Código Pix copiado! Cole no app do seu banco.'));
}

function abrirPagamento(id) {
  $('selectCota').value = id;
  $('formPagamento').scrollIntoView({ behavior: 'smooth' });
}

async function enviar(dados) {
  const r = await fetch(CONFIG.appScriptUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(dados) });
  return r.json();
}

async function enviarMensagem(e) {
  e.preventDefault();
  $('statusMsg').textContent = 'Enviando...';
  const res = await enviar({ acao: 'mensagem', nome: $('msgNome').value, mensagem: $('msgTexto').value });
  $('statusMsg').textContent = res.ok ? 'Mensagem enviada! Obrigado. Ela aparece aqui depois de aprovada.' : 'Não foi possível enviar. Tente novamente.';
  if (res.ok) e.target.reset();
}

async function enviarPagamento(e) {
  e.preventDefault();
  const id = $('selectCota').value;
  const cota = CONFIG.cotas.find(c => c.id === id);
  $('statusPag').textContent = 'Enviando...';
  const res = await enviar({ acao: 'pagamento', nome: $('pagNome').value, cota: cota.titulo, valor: cota.valor, observacao: $('pagObs').value });
  $('statusPag').textContent = res.ok ? 'Obrigado! Registramos seu presente.' : 'Não foi possível registrar. Tente novamente.';
  if (res.ok) e.target.reset();
}

async function carregarMensagens() {
  if (!CONFIG.appScriptUrl.startsWith('http')) return;
  const r = await fetch(CONFIG.appScriptUrl);
  const res = await r.json();
  $('mural').innerHTML = res.mensagens.length
    ? res.mensagens.map(m => `<div class="mensagem"><strong>${escapar(m.nome)}</strong><br>${escapar(m.mensagem)}</div>`).join('')
    : '<p class="aviso">Seja o primeiro a deixar uma mensagem.</p>';
}

function escapar(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

// Loop suave via transform + duplicação; evita "pulo" no reinício
function iniciarLoopSuave() {
  const track = document.getElementById('galeria-track');
  if (!track) return;

  // duplica os itens (HTML) para termos sequência contínua
  track.innerHTML = track.innerHTML + track.innerHTML;

  const imgs = track.querySelectorAll('img');
  // espera imagens carregarem para medir larguras corretamente
  const imgPromises = Array.from(imgs).map(img => new Promise(res => {
    if (img.complete) return res();
    img.onload = img.onerror = res;
  }));

  Promise.all(imgPromises).then(() => {
    // calcula largura total do conjunto original (antes da duplicação)
    const children = Array.from(track.children);
    const half = children.length / 2;
    let totalWidth = 0;
    for (let i = 0; i < half; i++) {
      const w = children[i].getBoundingClientRect().width;
      // gap entre itens é 16px (CSS)
      totalWidth += w + 16;
    }

    // animação por requestAnimationFrame usando transform (mais suave)
    let offset = 0;
    const speed = 0.4; // pixels por frame — ajuste para alterar velocidade
    let rafId = null;

    function step() {
      offset += speed;
      if (offset >= totalWidth) offset -= totalWidth; // reinicia sem pulo
      track.style.transform = `translateX(${-offset}px)`;
      rafId = requestAnimationFrame(step);
    }

    // inicia
    track.style.willChange = 'transform';
    step();

    // opcional: expõe para depuração
    track._stop = () => cancelAnimationFrame(rafId);
  });
}

window.addEventListener('DOMContentLoaded', () => {
  preencherTextos();
  atualizarContagem();
  setInterval(atualizarContagem, 1000);
  carregarMensagens();
  $('formMensagem').addEventListener('submit', enviarMensagem);
  $('formPagamento').addEventListener('submit', enviarPagamento);
  iniciarLoopSuave();
});
</script>

<header class="hero">
  <p>Vamos renovar nossos votos</p>
  <h1 id="titulo"></h1>
  <p id="dataTexto"></p>
  <div class="contagem">
    <div><span id="dias">0</span>dias</div>
    <div><span id="horas">0</span>horas</div>
    <div><span id="minutos">0</span>min</div>
    <div><span id="segundos">0</span>seg></div>
  </div>
</header>

<section>
  <h2>Nossa História</h2>
  <p id="historia" style="text-align:center;max-width:680px;margin:auto"></p>
</section>

<section>
  <h2>Cerimônia e Festa</h2>
  <div class="grid">
    <div class="card"><h3>Cerimônia</h3><p id="cerimonia"></p></div>
    <div class="card"><h3>Festa</h3><p id="festa"></p></div>
  </div>
</section>

<section>
  <h2>Galeria</h2>
  <div class="galeria-wrapper">
    <div class="galeria" id="galeria" aria-label="Galeria de fotos">
      <div class="galeria-track" id="galeria-track">
        <div class="galeria-item"><img src="FOTO_1.jpg" alt="Foto 1"></div>
        <div class="galeria-item"><img src="FOTO_2.jpg" alt="Foto 2"></div>
        <div class="galeria-item"><img src="FOTO_3.jpg" alt="Foto 3"></div>
        <div class="galeria-item"><img src="FOTO_4.jpg" alt="Foto 4"></div>
        <div class="galeria-item"><img src="FOTO_5.jpg" alt="Foto 5"></div>
        <div class="galeria-item"><img src="FOTO_6.jpeg" alt="Foto 6"></div>
        <div class="galeria-item"><img src="FOTO_7.jpeg" alt="Foto 7"></div>
      </div>
    </div>
  </div>
</section>

<section>
  <h2>Perguntas Frequentes</h2>
  <div id="faq"></div>
</section>

<section>
  <h2>Lista de Presentes</h2>
  <p style="text-align:center" class="aviso">Escolha uma cota, copie o Pix e, depois de pagar, registre aqui para a gente saber.</p>
  <div class="grid" id="listaCotas"></div>
  <div class="card" id="formPagamento" style="margin-top:28px">
    <h3>Registrar pagamento</h3>
    <form id="formPagamentoForm">
      <input id="pagNome" placeholder="Seu nome" required maxlength="80">
      <select id="selectCota"></select>
      <input id="pagObs" placeholder="Observação (opcional)" maxlength="200">
      <button type="submit">Registrar</button>
      <p class="msg-status" id="statusPag"></p>
    </form>
  </div>
</section>

<section>
  <h2>Deixe uma Mensagem</h2>
  <div class="card">
    <form id="formMensagem">
      <input id="msgNome" placeholder="Seu nome" required maxlength="80">
      <textarea id="msgTexto" rows="4" placeholder="Sua mensagem" required maxlength="500"></textarea>
      <button type="submit">Enviar</button>
      <p class="msg-status" id="statusMsg"></p>
    </form>
  </div>
  <h3 style="margin-top:36px">Mural de recados</h3>
  <div id="mural"></div>
</section>

</body>
</html>
